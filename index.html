<meta property="og:title" content="some clouds">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#202020;font-family:Georgia,"Times New Roman",serif}
body{cursor:none}
.sky{position:relative;display:flex;flex-direction:column;width:100%;min-height:max(700px,100dvh);background:#fff}
.about{position:absolute;top:28px;right:38px;z-index:2;color:#202020;text-decoration:none;font-size:13px;letter-spacing:.06em}
/* Two cloud destinations frame the small central scene. */
.constellation{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,1.2fr) minmax(0,1fr);align-items:center;gap:32px;width:90%;max-width:1120px;flex:1;margin:0 auto;padding:80px 0 48px}
.center-mark{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.title-kokumo{display:block;width:190px;height:auto;margin-bottom:18px;pointer-events:none;user-select:none}
h1{margin:0;font-size:clamp(28px,3.2vw,42px);font-weight:400;letter-spacing:.055em;white-space:nowrap}
.sub{margin-top:12px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.24em;color:#888;text-transform:uppercase;white-space:nowrap}
.top-kuumo{--f:5px;display:block;width:90px;height:auto;margin-top:26px;pointer-events:none;user-select:none;animation:float 5.4s ease-in-out infinite;animation-delay:-1.4s}
.cloud-link{--f:8px;display:flex;flex-direction:column;align-items:center;gap:8px;justify-self:center;max-width:100%;padding:8px 0;border:0;background:transparent;color:#202020;text-decoration:none;animation:float 6s ease-in-out infinite}
.cloud{display:block;width:clamp(170px,20vw,250px);max-width:100%;aspect-ratio:5/3;object-fit:cover;object-position:center 43%;mix-blend-mode:multiply;transition:transform .28s}
.label{font-size:clamp(22px,2.3vw,30px);letter-spacing:.04em;white-space:nowrap}
.jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;font-size:clamp(10px,1vw,12px);color:#8d8d8d;letter-spacing:.12em;white-space:nowrap}
.cloud-link:hover .cloud,.cloud-link:focus-visible .cloud{transform:scale(1.05) rotate(-1deg)}
.cloud-link:focus-visible{outline:1px dashed #888;outline-offset:10px;border-radius:12px}
.math{grid-column:1;grid-row:1;animation-delay:-3.1s}
.shop{grid-column:3;grid-row:1;animation-delay:-2s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 calc(var(--f)*-1)}}
.footer{position:relative;flex:none;padding:0 20px 18px;text-align:center;white-space:nowrap}
.footer-links{width:max-content;max-width:100%;margin:0 auto}
.footer-credit{position:absolute;right:38px;bottom:18px;text-align:right}
.footer-tagline,.footer-meet,.footer-social,.footer-name,.footer-project{display:block;white-space:nowrap}
.footer-tagline{margin-bottom:5px;color:#666;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;font-size:10px;letter-spacing:.04em}
.footer-meet,.footer-social{width:max-content;max-width:100%;margin-right:auto;margin-left:auto;color:#666;text-decoration:none;font-size:10px;letter-spacing:.06em}
.footer-meet{margin-bottom:7px}
.footer-social{margin-bottom:5px}
.footer-social-disabled{color:#999}
.footer-name{margin-top:8px;font-size:12px;letter-spacing:.08em}
.footer-project{margin-top:3px;font-size:9px;font-style:italic;letter-spacing:.06em;color:#666}
.footer-links .footer-social-disabled{margin-bottom:0}
.footer-credit .footer-name{margin-top:0}
.footer-meet:hover,.footer-meet:focus-visible,.footer-social[href]:hover,.footer-social[href]:focus-visible{color:#202020;text-decoration:underline;text-underline-offset:4px}
.cursor{position:fixed;width:20px;height:20px;left:0;top:0;pointer-events:none;z-index:99;transform:translate(-3px,-3px)}
.cursor svg{width:100%;height:100%}
.cursor path{fill:#fff;stroke:#242424;stroke-width:1.4;stroke-linejoin:round}
@media(max-width:700px){
  body{cursor:auto}
  .cursor{display:none}
  .sky{min-height:100dvh;padding:0 20px}
  .about{top:22px;right:20px}
  .constellation{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px;width:100%;padding:66px 0 40px}
  .center-mark{grid-column:1/-1;grid-row:1}
  .title-kokumo{width:150px;margin-bottom:12px}
  h1{font-size:29px}
  .sub{margin-top:9px;font-size:10px}
  .top-kuumo{width:68px;margin-top:18px}
  .cloud-link{grid-row:2;gap:6px;width:100%}
  .math{grid-column:1}
  .shop{grid-column:2}
  .cloud{width:180px}
  .label{font-size:22px}
  .jp{font-size:10px;letter-spacing:.06em}
  .footer{padding:0 0 18px}
  .footer-credit{position:static;margin-top:16px;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  .cloud-link,.top-kuumo{animation:none}
  .cloud{transition:none}
}
@media(hover:none),(pointer:coarse){
  body{cursor:auto}
  .cursor{display:none}
}
</style>
</head>
<body>
<main class="sky">
  <a class="about" href="./about/">About</a>
  <div class="constellation">
    <div class="center-mark">
      <img class="title-kokumo" src="./assets/characters/kokumo-balloon.svg" alt="こくもが小さなここくもを風船のようにひもで持っている" width="240" height="200" draggable="false">
      <h1>some clouds</h1>
      <div class="sub">tap a cloud</div>
      <img class="top-kuumo" src="./assets/kuumo/c5.png" alt="" aria-hidden="true" draggable="false">
    </div>

    <a class="cloud-link math" href="https://sakurak02.github.io/math-study-log/">
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Math</span><span class="jp">数学学習記録</span>
    </a>
    <a class="cloud-link shop" href="./shop/">
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Shop</span><span class="jp">本と小さな作品</span>
    </a>
  </div>
  <footer class="footer">
    <div class="footer-links"><span class="footer-tagline">クーモとこくもと、ときどきくもくもここくも</span><a class="footer-meet" href="./characters/">meet the clouds ↗</a><a class="footer-social" href="https://x.com/kokumo_cloud">kokumo X (Japanese) ↗</a><span class="footer-social footer-social-disabled">kokumo Instagram (English) ↗</span></div>
    <div class="footer-credit"><span class="footer-name">sakurak02</span><span class="footer-project">a project by K企画</span></div>
  </footer>
</main>
<div class="cursor"><svg viewBox="0 0 24 24"><path d="M3 2.5 L18 13 L11.4 14.2 L8.5 21 L3 2.5 Z"/></svg></div>
<script>
const c=document.querySelector('.cursor');window.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
</script>
</body>
</html>

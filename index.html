<meta property="og:title" content="some clouds">
<meta property="og:description" content="数学を学んだり、小さなアプリをつくったり。その記録を集めた個人サイト。">
<meta property="og:image" content="https://sakurak02.github.io/some-clouds/assets/ogp/ogp-top-20261005.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1102">

<meta property="og:type" content="website">
<link rel="icon" href="./assets/cloud.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#202020;font-family:Georgia,"Times New Roman",serif}
body{cursor:none;overflow:hidden}
.sky{position:relative;width:100%;height:100dvh;min-height:640px;background:#fff}
.about{position:absolute;top:28px;right:38px;z-index:2;color:#202020;text-decoration:none;font-size:13px;letter-spacing:.06em}
.constellation{position:absolute;inset:42px 5vw 52px;margin:auto;max-width:980px;transform:translateY(-34px)}
.center-mark{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);z-index:1}
.title-kokumo{position:absolute;left:50%;bottom:100%;display:block;width:80px;height:auto;transform:translateX(-50%);pointer-events:none;user-select:none}
h1{margin:0;font-size:clamp(22px,2.1vw,30px);font-weight:400;letter-spacing:.07em;white-space:nowrap}
.sub{margin-top:7px;font-family:Arial,sans-serif;font-size:10px;letter-spacing:.22em;color:#888;text-transform:uppercase;white-space:nowrap}
.top-kuumo{--f:5px;position:absolute;top:52px;left:50%;display:block;width:68px;max-width:15vw;height:auto;transform:translateX(-50%);pointer-events:none;user-select:none;animation:float 5.4s ease-in-out infinite;animation-delay:-1.4s}
.cloud-link{--f:8px;position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:0;background:transparent;color:#202020;text-decoration:none;transform:translate(-50%,-50%);animation:float 6s ease-in-out infinite}
.cloud-link[hidden]{display:none}
.cloud{display:block;width:clamp(120px,11vw,150px);aspect-ratio:5/3;object-fit:cover;object-position:center 43%;mix-blend-mode:multiply;transition:.28s}
.label{font-size:clamp(14px,1.25vw,18px);letter-spacing:.04em;white-space:nowrap}
.jp{font-family:Arial,sans-serif;font-size:9px;color:#8d8d8d;letter-spacing:.12em;white-space:nowrap}
.cloud-link:hover .cloud{transform:scale(1.07) rotate(-1deg)}
.apps{left:28%;top:28%;animation-delay:-3.1s}
.shop{left:72%;top:28%;animation-delay:-3.7s}
.development{left:28%;top:72%;animation-delay:-2s}
.reading{left:72%;top:72%;animation-delay:-4.2s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 calc(var(--f)*-1)}}
.footer{position:absolute;right:0;bottom:16px;left:0;text-align:center;white-space:nowrap}
.footer-links{width:max-content;max-width:100%;margin:0 auto}
.footer-credit{position:absolute;right:38px;bottom:0;text-align:right}
.footer-tagline,.footer-meet,.footer-social,.footer-name,.footer-project{display:block;white-space:nowrap}
.footer-tagline{margin-bottom:5px;color:#666;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;font-size:10px;letter-spacing:.04em}
.footer-meet,.footer-social{width:max-content;max-width:100%;margin-right:auto;margin-left:auto;color:#666;text-decoration:none;font-size:10px;letter-spacing:.06em}
.footer-meet{margin-bottom:7px}
.footer-social{margin-bottom:5px}
.footer-social-disabled{color:#999}
.footer-name{margin-top:8px;font-size:12px;letter-spacing:.08em}
.footer-project{margin-top:3px;font-size:9px;font-style:italic;letter-spacing:.06em;color:#666}
.footer-links .footer-social-disabled{margin-bottom:0}
.footer-credit .footer-name{margin-top:0}
.footer-meet:hover,.footer-meet:focus-visible,.footer-social[href]:hover,.footer-social[href]:focus-visible{color:#202020;text-decoration:underline;text-underline-offset:4px}
.cursor{position:fixed;width:20px;height:20px;left:0;top:0;pointer-events:none;z-index:99;transform:translate(-3px,-3px)}
.cursor svg{width:100%;height:100%}
.cursor path{fill:#fff;stroke:#242424;stroke-width:1.4;stroke-linejoin:round}
@media(max-width:700px){
  html,body{height:auto;min-height:100%;overflow-x:hidden}
  body{cursor:auto;overflow-y:auto}
  .cursor{display:none}
  .sky{height:auto;min-height:100dvh;padding:22px 20px}
  .about{top:22px;right:20px}
  .constellation{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;width:100%;max-width:none;margin:0;padding-top:82px;transform:none}
  .center-mark{position:relative;left:auto;top:auto;grid-column:1/-1;width:100%;min-height:104px;transform:none}
  .title-kokumo{bottom:100%;width:72px}
  h1{font-size:23px}
  .sub{margin-top:6px}
  .top-kuumo{top:49px;left:50%;width:48px;max-width:14vw}
  .cloud-link{position:static;justify-self:center;width:max-content;max-width:100%;min-height:110px;gap:4px;transform:none}
  .cloud{width:118px}
  .label{font-size:15px}
  .jp{font-size:9px}
  .footer{position:static;margin-top:18px}
  .footer-credit{position:static;margin-top:8px;text-align:center}
}
</style>
</head>
<body>
<main class="sky">
  <a class="about" href="./about/">About</a>
  <div class="constellation">
    <div class="center-mark">
      <img class="title-kokumo" src="./assets/characters/kokumo.png" alt="" aria-hidden="true" draggable="false">
      <h1>some clouds</h1>
      <div class="sub">tap a cloud</div>
      <img class="top-kuumo" src="./assets/kuumo/c5.png" alt="" aria-hidden="true" draggable="false">
    </div>

    <a class="cloud-link apps" href="./apps/">
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Apps</span><span class="jp">小さなアプリ</span>
    </a>
    <a class="cloud-link shop" href="./shop/">
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Shop</span><span class="jp">本と小さな作品</span>
    </a>
    <a class="cloud-link development" href="./development/">
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Development</span><span class="jp">開発の記録</span>
    </a>
    <!-- Readingを再表示する場合は、次のリンクの hidden 属性を外す。 -->
    <a class="cloud-link reading" href="./reading/" hidden>
      <img class="cloud" src="./assets/characters/kumokumo.png" alt="" aria-hidden="true" draggable="false">
      <span class="label">Reading</span><span class="jp">読書の記録</span>
    </a>
  </div>
  <footer class="footer">
    <div class="footer-links"><span class="footer-tagline">クーモとこくもと、ときどきくもくもここくも</span><a class="footer-meet" href="./characters/">meet the clouds ↗</a><a class="footer-social" href="https://x.com/kokumo_cloud">kokumo X (Japanese) ↗</a><span class="footer-social footer-social-disabled">kokumo Instagram (English) ↗</span></div>
    <div class="footer-credit"><span class="footer-name">sakurak02</span><span class="footer-project">a project by K企画</span></div>
  </footer>
</main>
<div class="cursor"><svg viewBox="0 0 24 24"><path d="M3 2.5 L18 13 L11.4 14.2 L8.5 21 L3 2.5 Z"/></svg></div>
<script>
const c=document.querySelector('.cursor');window.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
</script>
</body>
</html>

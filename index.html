<title>some clouds</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#202020;font-family:Georgia,"Times New Roman",serif;overflow:hidden}body{cursor:none}
.sky{position:relative;width:100%;height:100dvh;min-height:620px;background:#fff}
h1{position:absolute;top:34px;left:50%;transform:translateX(-50%);margin:0;font-size:clamp(20px,2.1vw,30px);font-weight:400;letter-spacing:.07em}
.sub{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:10px;letter-spacing:.22em;color:#888;text-transform:uppercase}
.about{position:absolute;top:34px;right:38px;color:#202020;text-decoration:none;font-size:13px;letter-spacing:.06em}
.cloud-link{--f:10px;position:absolute;display:flex;flex-direction:column;align-items:center;gap:7px;color:#202020;text-decoration:none;transform:translate(-50%,-50%);animation:float 6s ease-in-out infinite}
.cloud{width:clamp(112px,12vw,170px);filter:drop-shadow(0 5px 7px rgba(0,0,0,.035));transition:.28s}
.cloud path{fill:#fff;stroke:#2c2c2c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.label{font-size:clamp(13px,1.45vw,19px);letter-spacing:.04em;white-space:nowrap}.jp{font-family:Arial,sans-serif;font-size:10px;color:#8d8d8d;letter-spacing:.12em}
.cloud-link:hover .cloud{transform:scale(1.08) rotate(-1deg)}
.math{left:38%;top:38%;animation-delay:-3.1s}.physics{left:62%;top:38%;animation-delay:-4.2s}.notes{left:50%;top:59%;animation-delay:-2s}.notes .cloud{width:clamp(80px,9vw,128px)}.notes .label{font-size:clamp(12px,1.15vw,16px)}.notes .jp{font-size:9px}
.kuumo{position:absolute;display:block;object-fit:contain;pointer-events:none;user-select:none}.kuumo-c2{left:14%;top:68%;width:104px;transform:translate(-50%,-50%) rotate(-3deg)}.kuumo-c3{left:86%;top:68%;width:110px;transform:translate(-50%,-50%) rotate(2deg)}.kuumo-c5{left:50%;top:17%;width:112px;transform:translate(-50%,-50%) rotate(3deg)}.kuumo-c4{left:50%;top:82%;width:112px;transform:translate(-50%,-50%) rotate(-2deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 calc(var(--f)*-1)}}
.footer{position:absolute;left:50%;bottom:23px;transform:translateX(-50%);text-align:center;white-space:nowrap}
.footer .name{display:block;font-size:12px;letter-spacing:.08em}.footer .project{display:block;margin-top:3px;font-size:9px;font-style:italic;letter-spacing:.06em;color:#666}
.cursor{position:fixed;width:20px;height:20px;left:0;top:0;pointer-events:none;z-index:99;transform:translate(-3px,-3px)}.cursor svg{width:100%;height:100%}.cursor path{fill:#fff;stroke:#242424;stroke-width:1.4;stroke-linejoin:round}
@media(max-width:700px){body{cursor:auto}.cursor{display:none}h1{top:27px}.sub{top:63px}.about{top:27px;right:22px}.cloud{width:clamp(104px,29vw,138px)}.math{left:50%;top:30%}.physics{left:50%;top:49%}.notes{left:50%;top:67%}.notes .cloud{width:clamp(80px,22vw,104px)}.notes .label{font-size:13px}.kuumo-c2{left:9%;top:70%;width:54px}.kuumo-c3{left:91%;top:70%;width:58px}.kuumo-c5{left:50%;top:16%;width:58px}.kuumo-c4{left:50%;top:83%;width:62px}.label{font-size:15px}.footer{bottom:18px}}

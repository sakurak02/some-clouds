<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="some clouds の本と作品集。">
<title>Books — some clouds</title>
<link rel="icon" href="../assets/cloud.svg" type="image/svg+xml">
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#222}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif}
.page{min-height:100dvh;padding:38px 50px 30px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand,.back{font-family:Georgia,"Times New Roman",serif;text-decoration:none;color:inherit}
.brand{font-size:18px;letter-spacing:.07em}
.back{font-size:12px;letter-spacing:.05em;color:#666}
.content{width:min(720px,100%);margin:auto;padding:86px 0 100px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,3vw,40px);font-weight:400;letter-spacing:.03em}
.books-list{margin-top:34px}
.empty{margin:0;font-size:15px;line-height:2;letter-spacing:.04em}
.footer{margin-top:auto;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.06em}
.footer-x{display:block;margin-bottom:7px;color:#666;text-decoration:none;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;font-size:10px;letter-spacing:.07em}
.footer-x:hover,.footer-x:focus-visible{color:#202020;text-decoration:underline;text-underline-offset:4px}
@media(max-width:700px){
  .page{padding:28px 22px 22px}
  .brand{font-size:16px}
  .content{padding:58px 0 72px}
  .books-list{margin-top:26px}
  .empty{font-size:14px;line-height:1.95}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="../">some clouds</a>
    <a class="back" href="../">← Home</a>
  </header>
  <main class="content">
    <h1>Books</h1>
    <section class="books-list" aria-label="書籍一覧">
      <p class="empty">ただいま、最初の一冊を制作中です。</p>
    </section>
  </main>
  <footer class="footer"><a class="footer-x" href="https://x.com/kokumo_cloud">こくものX ↗</a>sakurak02 · a project by K企画</footer>
</div>

</html>

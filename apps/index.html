<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="some clouds の小さなブラウザアプリ。">
<title>Apps — some clouds</title>
<link rel="icon" href="../assets/cloud.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site-language.css">
<script src="../assets/site-language.js" defer></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#222}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif}
a{color:inherit}
.page{min-height:100dvh;padding:38px 50px 30px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:18px;letter-spacing:.07em;text-decoration:none}
.top-nav{display:flex;align-items:center;gap:14px}
.back{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.05em;text-decoration:none;color:#666}
.content{position:relative;width:min(720px,100%);margin:86px auto 100px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,3vw,40px);font-weight:400;letter-spacing:.03em}
.section-name{margin:34px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.08em;color:#777}
.apps-kuumo{position:absolute;top:-32px;right:clamp(4px,3vw,28px);display:block;width:144px;max-width:28vw;height:auto;pointer-events:none;user-select:none}
.apps-list{margin-top:66px;border-top:1px solid #dadada;border-bottom:1px solid #dadada}
.app-entry{padding:22px 2px 23px}
.app-entry h2{margin:0;font-size:14px;font-weight:500;line-height:1.7;letter-spacing:.04em}
.app-entry + .app-entry{border-top:1px solid #dadada}
.app-description{margin:8px 0 0;font-size:13px;line-height:1.9}
.app-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:12px;line-height:1.8}
.app-link{text-underline-offset:3px}
.app-guide{color:#666}
.footer{margin-top:auto;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.06em}
@media(max-width:700px){
  .page{padding:28px 22px 22px}
  .brand{font-size:16px}
  .content{margin:58px auto 72px}
  .section-name{margin-top:26px}
  .apps-kuumo{position:static;width:92px;max-width:30vw;margin:-4px auto -6px}
  .apps-list{margin-top:48px}
  .app-entry{padding:19px 2px 20px}
  .app-entry h2{font-size:13px}
}
</style>
<link rel="stylesheet" href="../assets/site-footer.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="../">some clouds</a>
    <div class="top-nav">
      <div class="language-switch" role="group" aria-label="言語 / Language">
        <button type="button" data-language-button="ja" aria-pressed="true">日本語</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language-button="en" aria-pressed="false">English</button>
      </div>
      <a class="back" href="../">← Home</a>
    </div>
  </header>
  <main class="content">
    <h1 id="apps-heading">Apps</h1>
    <p class="section-name"><span data-language="ja">小さなアプリをつくっています。</span><span data-language="en" hidden>I make little web apps.</span></p>
    <img class="apps-kuumo" src="../assets/kuumo/kumomo-apps.png" alt="スマートフォンを見ているくもも" data-alt-ja="スマートフォンを見ているくもも" data-alt-en="kumomo looking at a smartphone" draggable="false">
    <section class="apps-list" aria-labelledby="apps-heading">
      <article class="app-entry">
        <h2 id="kokumo-log"><span data-language="ja">こくもログ</span><span data-language="en" hidden>Kokumo Log</span></h2>
        <p class="app-description"><span data-language="ja">こくもと一緒に、日々の記録を残すWebアプリ。</span><span data-language="en" hidden>A web app for keeping a daily log with kokumo.</span></p>
        <p class="app-links">
          <a class="app-link" href="https://kokumo-log.pages.dev/"><span data-language="ja">Webアプリを開く</span><span data-language="en" hidden>Open the web app</span></a>
          <!-- 紹介ページ公開後に、この案内をリンクに差し替える。 -->
          <span class="app-guide" data-detail-href="./kokumo-log/"><span data-language="ja">紹介ページは準備中</span><span data-language="en" hidden>App guide coming soon</span></span>
        </p>
      </article>
    </section>
  </main>
  <footer class="footer">
    <span class="footer-tagline">クーモとこくもと、ときどきくもくもここくも</span>
    <div class="footer-credit"><span class="footer-name">sakurak02</span><span class="footer-project">a project by K企画</span></div>
  </footer>
</div>
</body>
</html>
